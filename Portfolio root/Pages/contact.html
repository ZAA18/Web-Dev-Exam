<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Zubuhle here">
    <title>Contact Page</title>
    <script src="../Scripts javascript/navigation.js" defer> </script>
    <script src="../Scripts javascript/contact.js" defer></script>
     <link rel="stylesheet" href="../css/contact.css">
     <link rel = "stylesheet" href="../css/navigation.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
        <!-- navigation -->
   <header class = "navbar">

    <div class ="logo- container">
         <img src = "../Assets/Images/za without.png" class = "logo">
    </div>

    <nav>
       <ul class = "nav-links">
           <li id = "homeBtn">Home</li>
           <li>|</li>
           <li id = "aboutBtn">About</li>
           <li>|</li>
           <li id ="projectsBtn">Projects</li>
           <li>|</li>
           <li id = "contactBtn" class="active">Contact</li>
       </ul>
   </nav>

   <div class = "social-links">
       <img src = "../Assets/Images/github-sign.png"
           id="githubBtn"
           alt="GitHub">
       <img src = "../Assets/Images/linkedin.png"
            id="linkedinBtn"
            alt = "linkedIn">
       <img src="../Assets/Images/itch_io_logo_icon_145157.png"
            id="itchBtn"
            alt = "Itch.io">
   </div>
   </header>
     
   <!-- Contact Section -->

   <main class="contact-container">

    <h1> Contact Me</h1>

    <form id="contactform">

        <div class="contact-grid">

            <div class=" form-group">
                <label for="firstName">First Name</label>
                <input type="text"
                       id="firstName"
                       name="firstName">
                
                       <span class="error" id="firstNameError"></span>

            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text"
                       id="lastName"
                       name="lastName">
                    
                       <span class="error" id="lastNameError"></span>
            </div>

            <div class="form-group">
                 <label for="email">Email</label>
            
                <input type="email"
                    id="email"
                    name="email">
               
                    <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                 <label for="subject">Subject</label>

                 <input type="text"
                         id="subject"
                         name=" subject">

                    <span class="error" id="subjectError"></span>
            </div>
        </div>

            <div class="message-group">

                <label for="message">Message</label>

                <textarea id="message"
                          name="message"></textarea>

                          <span class="error" id="messageError"></span>
            </div>

            <div class="submit-container">
                 <button type="submit" id="submitBtn">Submit</button>
            </div>
    
         <!-- footer -->

   <footer>
    <p>
       Zubuhle Nel | Game Developer | Web Developer | Software Developer
   </p>

   <p>
       Email: zbuhle01@gmail.com
   </p>

   <div class = "footer-Socials">
       <button id="footerGithubBtn">
           GitHub
       </button>

       <button id="footerLinkedinBtn">
           linkedIn
       </button>

       <button id="footerItchBtn">
           Itch.io
       </button>
   </div>

   <p>
       @2026 Zubuhle Nel. All rights reserved.
   </p>
  </footer>

</body>
</html>
